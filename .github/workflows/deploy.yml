name: Deploy Zudin987 Aniimax

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "zudin987-aniimax-pages"
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'Zudin987/aniimax'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build WASM
        run: wasm-pack build --target web --out-dir web/pkg

      - name: Version browser assets
        run: python3 scripts/version_web_assets.py --revision "$GITHUB_SHA"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./web

  deploy:
    if: github.repository == 'Zudin987/aniimax'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to Zudin987 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
