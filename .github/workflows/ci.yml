name: CI

on:
  push:
    branches:
      - main
      - 'sync/**'
      - 'feat/**'
      - 'fix/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Rust tests
        run: |
          cargo test --all-targets -- \
            --skip coverage::tests::baked_pair_options_really_fit \
            --skip coverage::tests::tidy_pair_layouts_keep_their_zones

      - name: JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/facility-config.js
          node --check web/worker.js
          node --check web/layout.js
          node --check web/layout-worker.js

      - name: Homeland layout smoke test
        run: node --experimental-default-type=module tests/layout_smoke.mjs

      - name: Aniimo staffing smoke test
        run: node --experimental-default-type=module tests/aniimo_team_smoke.mjs
