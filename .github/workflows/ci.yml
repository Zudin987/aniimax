name: CI

on:
  push:
    branches:
      - main
      - 'sync/**'
      - 'feat/**'
      - 'fix/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Rust tests
        run: |
          cargo test --release --locked --all-targets -- \
            --skip coverage::tests::baked_pair_options_really_fit \
            --skip coverage::tests::tidy_pair_layouts_keep_their_zones

      - name: JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/context-help.js
          node --check web/facility-config.js
          node --check web/worker.js
          node --check web/layout.js
          node --check web/layout-worker.js
          node --check web/share-code.js
          node --check web/share-config.js
          node --check web/setup-config.js
          node --check web/harvest-budget.js
          node --check web/festival-crafting.js

      - name: JavaScript regressions and smoke tests
        run: npm test

      - name: Browser asset version checks
        run: |
          python3 tests/version_web_assets_test.py
          node tests/asset_loader_smoke.mjs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Build WASM
        run: |
          cargo install wasm-pack --version 0.13.1 --locked
          wasm-pack build --target web --out-dir web/pkg --no-opt -- --locked
      - name: RV, Harvest Moon and E-Mode WASM/HiGHS regressions
        run: npm run test:wasm
      - name: Setup import and WASM UI smoke
        run: npm run test:ui
      - name: Keep tested WASM build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tested-wasm-build
          path: web/pkg/
      - name: Keep UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup-ui-screenshots
          path: test-results/
