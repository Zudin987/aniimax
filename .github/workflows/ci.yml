name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Rust tests
        run: |
          # These two inherited geometry-verification tests are extremely expensive
          # on GitHub's debug runners and can take 20+ minutes while competing with
          # each other. The fast packing regression tests still run on every push.
          cargo test --all-targets -- \
            --skip coverage::tests::baked_pair_options_really_fit \
            --skip coverage::tests::tidy_pair_layouts_keep_their_zones

      - name: JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/facility-config.js
          node --check web/worker.js
